# Canonical config — single source of truth. Box-specific tweaks should
# go through CLI flags rather than partial-yaml overrides; the script
# loaders do not deep-merge.

seed: 1337                         # numpy + torch + python-random seed

paths:
  # The same checkpoint serves both deterministic baseline (eval mode →
  # dropout is a no-op) and stochastic dropout inference (forced train mode
  # on dropouts). Produced by scripts/train_dropout_yolo.py.
  yolo_weights: "models/doorway_yolov8n_dropout.pt"
  yolo_dropout_weights: "models/doorway_yolov8n_dropout.pt"
  doorway_dataset_root: "data/doorway_combined"  # produced by scripts/prepare_doorway_data.py
  data_root: "data"                # OOD bucket manifests land under data/manifests/
  runs_root: "runs"                # JSONL logs, atomic appends

llm:
  # Model sweep — Gemma 4 family. Western-origin (Google DeepMind),
  # Apache 2.0, multimodal, native agentic / function-calling support.
  # Released May 2026 on Ollama. Sizes selected to span the SWaP
  # deployment envelope from edge (Orin Nano 8GB) to workstation
  # (AGX Orin / Thor).
  models:
    small:  "gemma4:e4b"           # ~4B effective (edge variant)
    medium: "gemma4:26b"           # 26B (MoE; compute-light, larger memory)
    large:  "gemma4:31b"           # 31B dense
  default_tier: medium

  # Inference parameters held constant across tiers
  host: "http://localhost:11434"
  temperature: 0.1                 # low but nonzero; Ollama's default is 0.8
  num_ctx: 4096
  seed: 42                         # captured for reproducibility; Ollama
                                   # respects this less consistently than vLLM,
                                   # so trial counts compensate
  request_timeout_s: 600           # HTTP timeout (seconds) for a single
                                   # ChatOllama.invoke. Cap on a hung
                                   # inference (Ollama server stall, GPU
                                   # lockup) so the run halts rather than
                                   # blocking indefinitely. Generous for
                                   # 31B-dense inference on Thor.

perception:
  K: 20                            # MC Dropout stochastic forward passes
  imgsz: 640                       # YOLO inference resolution
  conf_threshold: 0.25             # ultralytics default; baseline + dropout share it
  iou_threshold: 0.45
  device: "cuda"                   # "cuda" or "cpu"

calibration:
  # Temperature scaling for the deterministic baseline. Fit on the
  # calibration split of doorway_dataset_root.
  temperature: 0.8588                 # placeholder; calibrate_baseline.py overwrites
  ece_n_bins: 15
  fit_conf_threshold: 0.01         # detector conf cutoff used during T fitting;
                                   # lower than perception.conf_threshold (0.25)
                                   # so the fit sees both TPs and FPs. T is fit
                                   # over [fit_conf_threshold, 1.0] then applied
                                   # to all post-threshold runtime confidences.

variance_thresholds:
  # Cutoffs on epistemic_variance mapping to the variance_aware prompt's
  # categorical interpretation label (LOW / MEDIUM / HIGH). Recalibrated
  # 2026-05-11 against runs/step_b/summary.json, which observed:
  #   ID confident-correct median  = 0.0026  (IQR 0.0014–0.0049)
  #   OOD pilot median             = 0.0085  (IQR 0.0035–0.0181)
  # The original (low_max=0.05, high_min=0.15) values were ~10x too high;
  # under realised variance, the HIGH band would have been unreachable.
  low_max: 0.003                   # variance ≤ this → "LOW" (treat as confident).
                                   #   Matches the upper edge of typical
                                   #   confident-correct ID variance.
  high_min: 0.010                  # variance ≥ this → "HIGH" (treat as uncertain).
                                   #   Matches the lower edge of the OOD pilot's
                                   #   upper IQR (Q3=0.018); a confident detection
                                   #   above this threshold is materially uncertain.
                                   # variance in (low_max, high_min) → "MEDIUM".

experiment:
  conditions: ["baseline", "variance_aware"]
  trials_per_image: 3              # N — controls LLM stochasticity
  buckets: ["in_distribution_pos", "in_distribution_neg", "ood"]
  log_reasoning_chain: true

agent:
  max_turns: 4                     # cap reasoning loops per command
  available_tools: ["move_forward", "rotate", "look_around", "report", "defer"]

ros:
  # Off by default; live_demo.py and scripts/run_experiment.py with
  # --live flip these on. Experimental harness uses mock tools.
  enabled: false
  bridge_host: "localhost"
  bridge_port: 9090

dataset:
  # scripts/prepare_doorway_data.py — multi-source corpus assembly.
  split_seed: 1337                 # used for Gibson cap subsample + 80/10/10 split
  gibson_cap: 1500                 # synthetic-data cap; addendum-locked

training:
  # scripts/train_dropout_yolo.py — fine-tune YOLOv8n with embedded dropout.
  # Run on the AGX Thor (or a workstation GPU); not viable on CPU.
  starting_weights: "yolov8n.pt"   # ultralytics auto-downloads if missing
  data_yaml: "data/doorway_combined/data.yaml"
  output_checkpoint: "models/doorway_yolov8n_dropout.pt"
  epochs: 75                       # cap — early stopping on patience usually fires
                                   # well before this on the ~5500-image corpus.
  imgsz: 640
  batch: 16
  patience: 10                     # epochs without val mAP@0.5 improvement → stop
  device: "cuda"
  dropout_p: 0.25                  # placement fixed in uagent/perception/dropout.py
  project: "runs/train"            # ultralytics writes to runs/train/<name>/
  name: "doorway_yolov8n_dropout"
